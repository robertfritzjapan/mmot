<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMOT の4ステップ ─ 実践ワークシート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Lora:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee;
  --paper:#ffffff;
  --ink:#1f2328;
  --ink-2:#4b5158;
  --ink-3:#7a808a;
  --line:#dcd8cf;
  --line-2:#ebe8e1;
  --accent:#1d3a5f;
  --accent-soft:#e6ecf4;
  --warm:#b8621b;
  --warm-soft:#fbeee2;
  --done:#3f7d5a;
  --done-soft:#e3f0e8;
  --danger:#a83a2f;
  --radius:10px;
  --shadow:0 1px 2px rgba(31,35,40,.05),0 6px 20px rgba(31,35,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:14px;cursor:pointer}
textarea,input[type=text],input[type=date]{
  font-family:inherit;font-size:15px;line-height:1.7;color:var(--ink);
  width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;
  padding:10px 12px;resize:vertical;transition:border-color .15s,box-shadow .15s;
}
textarea{min-height:88px}
textarea:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea::placeholder,input::placeholder{color:#b0b4bb}

/* ---------- header ---------- */
header{
  background:var(--paper);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;
}
.hd-in{max-width:1240px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;min-width:240px}
.brand h1{font-size:19px;font-weight:700;margin:0;letter-spacing:.02em}
.brand h1 small{font-family:Lora,Georgia,serif;font-weight:500;font-size:12px;letter-spacing:.14em;color:var(--ink-3);margin-left:10px}
.brand .rfc{font-family:Lora,Georgia,serif;font-size:11px;letter-spacing:.24em;color:var(--ink-3)}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{
  border:1px solid var(--line);background:#fff;color:var(--ink-2);
  padding:7px 14px;border-radius:8px;font-weight:500;transition:all .15s;
}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#274b78}
.btn.warm{background:var(--warm);border-color:var(--warm);color:#fff}
.btn.warm:hover{background:#c9702a}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line-2)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:4px 10px;font-size:13px}

/* ---------- stepper ---------- */
.stepper-wrap{background:var(--paper);border-bottom:1px solid var(--line)}
.stepper{max-width:1240px;margin:0 auto;padding:0 28px;display:flex;align-items:stretch}
.step-tab{
  flex:1;display:flex;align-items:center;gap:10px;padding:14px 12px;
  border:none;background:none;text-align:left;color:var(--ink-3);
  border-bottom:3px solid transparent;transition:all .15s;position:relative;
}
.step-tab .num{
  width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
  flex-shrink:0;background:#fff;
}
.step-tab .lbl{display:flex;flex-direction:column;line-height:1.3}
.step-tab .lbl b{font-size:13.5px;font-weight:700;color:inherit}
.step-tab .lbl span{font-size:11px;letter-spacing:.06em}
.step-tab.open{color:var(--ink-2);cursor:pointer}
.step-tab.open:hover{background:var(--line-2)}
.step-tab.open .num{border-color:var(--done);color:var(--done);background:var(--done-soft)}
.step-tab.current{color:var(--accent);border-bottom-color:var(--accent)}
.step-tab.current .num{background:var(--accent);border-color:var(--accent);color:#fff}
.step-tab.locked{cursor:default;opacity:.55}
.step-tab.locked .num{color:var(--ink-3);background:var(--line-2)}
.step-tab.locked .lock{margin-left:auto;font-size:12px}
.step-tab.hidden-step{display:none}

/* ---------- layout ---------- */
main{max-width:1240px;margin:0 auto;padding:28px 28px 80px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.layout.with-side{grid-template-columns:minmax(300px,380px) minmax(0,1fr)}
@media (max-width:900px){.layout.with-side{grid-template-columns:1fr}}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card.main{padding:30px 34px}
.card-h{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
.card-h .k{font-family:Lora,Georgia,serif;font-size:12px;letter-spacing:.2em;color:var(--accent);font-weight:600}
.card-h h2{font-size:22px;margin:0;font-weight:700}
.lead{color:var(--ink-2);margin:0 0 22px;font-size:14.5px;max-width:720px}

.field{margin-bottom:20px}
.field label{display:block;font-weight:700;font-size:14.5px;margin-bottom:4px}
.field .hint{font-size:13px;color:var(--ink-3);margin-bottom:8px;line-height:1.6}
.field.inline{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.field.inline{grid-template-columns:1fr}}

.divider{border:none;border-top:1px dashed var(--line);margin:26px 0}
.sec-title{font-size:13px;letter-spacing:.12em;color:var(--ink-3);font-weight:700;margin:0 0 12px}

/* prompts box */
.prompts{background:var(--accent-soft);border-radius:8px;padding:12px 16px;margin-bottom:22px;font-size:13.5px;color:var(--ink-2)}
.prompts b{color:var(--accent);display:block;margin-bottom:4px;font-size:12px;letter-spacing:.1em}
.prompts ul{margin:0;padding-left:18px}
.prompts li{margin:2px 0}

/* repeatable rows */
.rows{display:flex;flex-direction:column;gap:12px}
.row{border:1px solid var(--line-2);border-radius:8px;padding:14px 16px;background:#fbfaf7;position:relative}
.row .row-n{position:absolute;top:10px;left:14px;font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.1em}
.row .rm{position:absolute;top:8px;right:8px}
.row .grid{display:grid;gap:10px;margin-top:18px}
.row .grid.c3{grid-template-columns:1.2fr 1.4fr 1fr}
.row .grid.c4{grid-template-columns:1.6fr .8fr .8fr 1fr}
@media (max-width:760px){.row .grid.c3,.row .grid.c4{grid-template-columns:1fr}}
.row .grid label{font-size:12px;font-weight:700;color:var(--ink-2);display:block;margin-bottom:3px}
.row textarea{min-height:64px;font-size:14px}
.add{margin-top:10px}

/* side (previous steps) */
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:130px;align-self:start;max-height:calc(100vh - 150px);overflow:auto;padding-right:2px}
.side-note{font-size:12px;color:var(--ink-3);letter-spacing:.08em;font-weight:700;margin:0 0 -4px}
.side .card{padding:0;overflow:hidden}
.side details summary{
  list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:10px;
  font-weight:700;font-size:14px;color:var(--ink-2);background:#fbfaf7;border-bottom:1px solid transparent
}
.side details[open] summary{border-bottom-color:var(--line-2)}
.side details summary::-webkit-details-marker{display:none}
.side details summary .k{font-family:Lora,Georgia,serif;font-size:11px;letter-spacing:.16em;color:var(--done);font-weight:600}
.side details summary .arrow{margin-left:auto;color:var(--ink-3);font-size:11px;transition:transform .15s}
.side details[open] summary .arrow{transform:rotate(90deg)}
.side .sbody{padding:12px 16px 14px;font-size:13.5px}
.side .sitem{margin-bottom:10px}
.side .sitem .t{font-size:11.5px;font-weight:700;color:var(--ink-3);margin-bottom:2px;letter-spacing:.04em}
.side .sitem .v{white-space:pre-wrap;color:var(--ink);line-height:1.6}
.side .sitem .v.empty{color:#b8bcc3;font-style:italic}
.side .sitem .v .li{padding:6px 10px;background:#fbfaf7;border-radius:6px;margin-bottom:6px;border:1px solid var(--line-2)}
.side .sitem .v .li .lt{font-size:11px;color:var(--ink-3);font-weight:700}
.side .edit-link{font-size:12px;color:var(--accent);background:none;border:none;padding:0;text-decoration:underline;margin-top:4px}

/* footer nav */
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:30px;padding-top:20px;border-top:1px solid var(--line-2);gap:12px;flex-wrap:wrap}
.nav .spacer{flex:1}
.nav .status{font-size:12.5px;color:var(--ink-3)}

/* meta bar */
.meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:24px}
@media (max-width:760px){.meta{grid-template-columns:1fr}}
.meta label{font-size:12px;font-weight:700;color:var(--ink-2);display:block;margin-bottom:3px}

/* private badge */
.private{display:inline-flex;align-items:center;gap:6px;background:var(--warm-soft);color:var(--warm);font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.04em}

/* toggle */
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#fff}
.toggle input{accent-color:var(--warm)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(31,35,40,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:26px 28px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{margin:0 0 8px;font-size:17px}
.modal p{margin:0 0 20px;color:var(--ink-2);font-size:14px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13.5px;opacity:0;transition:all .25s;pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* summary / print */
#summary{display:none}
.sum-step{margin-bottom:26px;break-inside:avoid}
.sum-step h3{font-size:15px;margin:0 0 8px;padding-bottom:6px;border-bottom:1.5px solid var(--ink)}
.sum-step h3 .k{font-family:Lora,Georgia,serif;font-size:11px;letter-spacing:.2em;margin-right:10px;color:var(--ink-3)}
.sum-item{margin-bottom:10px}
.sum-item .t{font-size:12px;font-weight:700;color:var(--ink-3)}
.sum-item .v{white-space:pre-wrap;font-size:13.5px}
.sum-item .v .li{padding:6px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px}
.sum-item .v .li .lt{font-size:11px;color:var(--ink-3);font-weight:700}

@media print{
  @page{margin:16mm}
  body{background:#fff;font-size:12.5px}
  header,.stepper-wrap,#app,.toast,.modal-bg{display:none!important}
  #summary{display:block!important}
  main{padding:0;max-width:none}
  .sum-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:16px}
  .sum-head h2{margin:0;font-size:18px}
  .sum-head .rfc{font-family:Lora,Georgia,serif;font-size:10px;letter-spacing:.24em}
  .sum-meta{font-size:12px;color:#444;margin-bottom:18px}
}
</style>
</head>
<body>

<header>
  <div class="hd-in">
    <div class="brand">
      <h1>MMOT の4ステップ <small>PRACTICE WORKSHEET</small></h1>
      <span class="rfc">ROBERT FRITZ CONSULTING</span>
    </div>
    <div class="tools">
      <label class="toggle" title="相手と画面を共有するときにオンにすると、ステップ0（自分だけの準備メモ）を非表示にします">
        <input type="checkbox" id="shareMode"> 画面共有モード
      </label>
      <button class="btn" id="btnSave">保存（JSON）</button>
      <button class="btn" id="btnLoad">読み込み</button>
      <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
      <button class="btn" id="btnPrint">印刷 / PDF</button>
      <button class="btn ghost danger" id="btnNew">新規セッション</button>
    </div>
  </div>
</header>

<div class="stepper-wrap">
  <div class="stepper" id="stepper"></div>
</div>

<main>
  <div id="app"></div>

  <!-- print summary -->
  <div id="summary"></div>
</main>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="mTitle"></h3>
    <p id="mBody"></p>
    <div class="acts">
      <button class="btn" id="mCancel">キャンセル</button>
      <button class="btn primary" id="mOk">OK</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   MMOT Worksheet — 定義
   ========================================================= */
const STEPS = [
  {
    id:'s0', num:'0', k:'STEP 0', title:'準備する', short:'準備', private:true,
    lead:'MMOTを始める前に、自分の頭の中を整理します。ここは自分だけのメモです（画面共有モードでは非表示になります）。',
    prompts:['今回、何を扱いたいのか。何を扱わないのか','自分は相手に何を期待していたのか。それは相手に伝わっていたか','この対話で、どんな状態になれば「うまくいった」と言えるか'],
    fields:[
      {id:'topic', label:'今回扱いたいこと', hint:'ひとつの出来事・成果に絞ります。いくつも混ぜると焦点がぼやけます。', ph:'例：先週の提案書が、期日までに顧客に届かなかった件'},
      {id:'expected', label:'自分が相手に期待していたこと', hint:'「いつまでに」「どのレベルで」「何を」。できるだけ具体的に。', ph:'例：金曜17時までに、レビュー済みの最終版を顧客に送ること'},
      {id:'conveyed', label:'その期待は、相手にどう伝わっていたか', hint:'伝えたつもりでも、実際には共有されていなかったことがよくあります。', ph:'例：口頭で「金曜まで」とは言ったが、レビューが必要とは明言していない'},
      {id:'why', label:'なぜ今、これを取り上げるのか', hint:'感情ではなく、この出来事が持つ意味・影響を言葉にしておきます。', ph:'例：この顧客は今期の主要案件で、同じことが続くと信頼を失う'},
      {id:'goal', label:'この対話で実現したいこと', hint:'責めることではなく、事実を共有し、次に活かす計画をつくることがMMOTの目的です。', ph:'例：お互いに事実を認め、次回から確実に届く仕組みを一緒に決める'},
      {id:'mind', label:'自分の状態を確かめる', hint:'MMOTは「真実を扱う機会」。怒りや失望を相手にぶつける場ではありません。落ち着いて事実に向き合える状態かどうかを確かめます。', ph:'例：少し苛立ちがある。事実の確認に集中し、評価的な言葉は避ける'}
    ]
  },
  {
    id:'s1', num:'1', k:'STEP 1', title:'事実を認知する', short:'事実を認知する',
    lead:'どのような期待と成果があったのか。期待と成果の間にはどのような乖離があったのか、そのことがどんな影響を及ぼすのかを整理しましょう。',
    prompts:['「何が起きたか」をお互いに同じ言葉で言えるか','評価や解釈ではなく、観察できる事実で書く','乖離があることを、両者が認めているか'],
    fields:[
      {id:'expect', label:'期待していたこと', hint:'合意されていた（あるいは、されているはずだった）期待。', ph:'例：金曜17時までに最終版を顧客へ送付'},
      {id:'actual', label:'実際の成果', hint:'何が、いつ、どのように起きたか。事実のみ。', ph:'例：月曜10時に送付。顧客から催促のメールが日曜に届いていた'},
      {id:'gap', label:'期待と成果の乖離', hint:'差はどこにあるか。時期・質・量・範囲など。', ph:'例：期日から約3日の遅れ。顧客への事前連絡がなかった'},
      {id:'impact', label:'乖離がもたらす影響', hint:'相手・チーム・顧客・自分自身への影響。今後への影響も含めて。', ph:'例：顧客の信頼が揺らいだ。次回の商談日程がずれた'},
      {id:'ack', label:'認知の共有', hint:'ここまでの事実について、相手も同じ認識か。ずれがあればそれを書きます。次のステップに進む前に、ここを揃えます。', ph:'例：遅れたことは認めている。「催促があった」ことは知らなかった'}
    ]
  },
  {
    id:'s2', num:'2', k:'STEP 2', title:'どのようにそうなったのかを分析する', short:'分析する',
    lead:'その結果はどのようにして起こったのか、どのような思考プロセスや想定があったのか、判断を一つひとつ追っていきます。',
    prompts:['「なぜ」ではなく「どのように」。原因探しではなく、プロセスをたどる','ひとつひとつの判断の時点で、何を見て、何を想定していたか','その想定は正しかったか。今から見るとどうか'],
    list:{
      id:'decisions', label:'判断の連鎖', hint:'出来事を時間順にたどり、分岐点となった判断を書き出します。',
      cols:[
        {id:'point', label:'判断・行動'},
        {id:'thinking', label:'そのときの思考・想定'},
        {id:'result', label:'その結果、何が起きたか'}
      ],
      ph:['例：木曜夜、レビュー依頼を出さずに自分で仕上げることにした','例：「時間がないからレビューは省いても大丈夫」と考えた','例：金曜に修正点が見つかり、週末にずれ込んだ']
    },
    fields2:[
      {id:'pattern', label:'見えてきたパターン・構造', hint:'今回だけの話か、繰り返されている型か。', ph:'例：締切が迫ると、確認の手順を飛ばす傾向がある'},
      {id:'learning', label:'ここから学べること', hint:'相手の学びと、自分（依頼した側）の学びの両方。', ph:'例：（相手）遅れそうな時点で先に連絡する。（自分）レビューが必要なら最初に明示する'}
    ]
  },
  {
    id:'s3', num:'3', k:'STEP 3', title:'プランをつくる', short:'プランをつくる',
    lead:'学んだことを活かして今後どうするかの新しい計画を立てます。',
    prompts:['「気をつける」「頑張る」ではなく、行動として書けるか','誰が、何を、いつまでに','今回の学びが、プランのどこに反映されているか'],
    fields:[
      {id:'outcome', label:'望む結果', hint:'次回、同じ状況で何が起きていれば成功か。', ph:'例：顧客との約束期日は、レビュー済みの状態で必ず守られている'},
      {id:'current', label:'現状（今の実態）', hint:'望む結果に対して、今どこにいるか。Step 1・2 の内容を踏まえて。', ph:'例：期日直前に作業が集中し、レビューの時間が取れていない'}
    ],
    list:{
      id:'actions', label:'具体的な行動計画', hint:'望む結果と現状の間を埋める行動。',
      cols:[
        {id:'what', label:'何をする'},
        {id:'who', label:'誰が'},
        {id:'when', label:'いつまでに'},
        {id:'note', label:'補足・条件'}
      ],
      ph:['例：提案書は締切の2営業日前にレビュー依頼を出す','例：担当者','例：次回案件から','例：遅れそうな場合はその時点で連絡']
    },
    fields2:[
      {id:'support', label:'必要な支援・リソース', hint:'相手が実行するために、自分やまわりが提供できるもの。', ph:'例：レビュー依頼が来たら24時間以内に返す'}
    ]
  },
  {
    id:'s4', num:'4', k:'STEP 4', title:'フィードバックシステムを確立する', short:'フィードバック',
    lead:'作ったプランが確実に実行できるかピクチャリングしてみましょう。また、望む結果を達成するために、どのような仕掛けがあったら役に立つでしょうか。',
    prompts:['プランが実行されている場面を、具体的に思い浮かべられるか','どこでつまずきそうか。つまずいたとき、誰がどう気づくか','うまくいっていることを、どうやって確かめるか'],
    fields:[
      {id:'picture', label:'ピクチャリング', hint:'プランを実行している場面を、時系列で思い描きます。無理なく実行できそうか。どこに現実味がないか。', ph:'例：案件開始時にカレンダーにレビュー日を入れる → 2営業日前に依頼が来る → 翌日返す → 期日前日に送付。…レビュー依頼のタイミングを忘れる可能性がある'},
      {id:'obstacles', label:'予想される障害と対処', hint:'ピクチャリングで見えた「つまずきそうな点」と、その対処。', ph:'例：複数案件が重なると忘れる → 案件登録時にリマインダーを自動設定'},
      {id:'signals', label:'フィードバックの仕掛け', hint:'進捗・結果を、いつ・誰が・どのように確認するか。結果が見える仕組み。', ph:'例：毎週月曜の定例で、今週の期日とレビュー状況を一覧で確認する'},
      {id:'checkpoints', label:'チェックポイント', hint:'次にこの件を振り返る日と、その時に何を確認するか。', ph:'例：2週間後の定例で、レビュー依頼が予定通り出ているか確認'}
    ],
    fields2:[
      {id:'followup', label:'次回フォローアップ', hint:'', type:'date'},
      {id:'closing', label:'対話を終えるにあたって', hint:'お互いが確認したこと、感じたこと。', ph:'例：事実を率直に共有できた。次回はこの計画がどう機能したかを見る'}
    ]
  }
];

const LS_KEY = 'mmot-worksheet-v1';

/* =========================================================
   状態
   ========================================================= */
let state = defaultState();
function defaultState(){
  const d = { meta:{date:new Date().toISOString().slice(0,10), who:'', partner:''}, current:0, unlocked:0, share:false, data:{} };
  STEPS.forEach(s=>{
    d.data[s.id] = {};
    (s.fields||[]).concat(s.fields2||[]).forEach(f=> d.data[s.id][f.id]='');
    if(s.list) d.data[s.id][s.list.id] = [emptyRow(s.list)];
  });
  return d;
}
function emptyRow(list){ const r={}; list.cols.forEach(c=>r[c.id]=''); return r; }

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const p = JSON.parse(raw); state = merge(defaultState(), p); }
  }catch(e){}
}
function merge(base, p){
  const out = JSON.parse(JSON.stringify(base));
  if(p.meta) Object.assign(out.meta, p.meta);
  if(typeof p.current==='number') out.current=p.current;
  if(typeof p.unlocked==='number') out.unlocked=p.unlocked;
  if(typeof p.share==='boolean') out.share=p.share;
  if(p.data) for(const k in out.data){ if(p.data[k]) Object.assign(out.data[k], p.data[k]); }
  return out;
}
let saveTimer=null;
function persist(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }, 200);
}

/* =========================================================
   描画
   ========================================================= */
const $ = s=>document.querySelector(s);
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function visibleIndex(i){ return !(state.share && STEPS[i].private); }

function renderStepper(){
  const el = $('#stepper'); el.innerHTML='';
  STEPS.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='step-tab';
    if(!visibleIndex(i)) b.classList.add('hidden-step');
    if(i===state.current) b.classList.add('current');
    else if(i<=state.unlocked) b.classList.add('open');
    else b.classList.add('locked');
    b.innerHTML = `<span class="num">${s.num}</span><span class="lbl"><b>${s.short}</b><span>${s.k}</span></span>${i>state.unlocked?'<span class="lock">🔒</span>':''}`;
    if(i<=state.unlocked) b.onclick=()=>goto(i);
    b.disabled = i>state.unlocked;
    el.appendChild(b);
  });
}

function fieldHTML(sid, f){
  const v = state.data[sid][f.id]||'';
  const input = f.type==='date'
    ? `<input type="date" data-s="${sid}" data-f="${f.id}" value="${esc(v)}">`
    : `<textarea data-s="${sid}" data-f="${f.id}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
  return `<div class="field"><label>${f.label}</label>${f.hint?`<div class="hint">${f.hint}</div>`:''}${input}</div>`;
}
function listHTML(sid, list){
  const rows = state.data[sid][list.id]||[];
  const c = list.cols.length;
  return `<div class="field"><label>${list.label}</label>${list.hint?`<div class="hint">${list.hint}</div>`:''}
    <div class="rows" data-list="${list.id}" data-s="${sid}">
    ${rows.map((r,ri)=>`<div class="row"><span class="row-n">${ri+1}</span>
      ${rows.length>1?`<button class="btn ghost sm rm" data-rm="${ri}" title="削除">✕</button>`:''}
      <div class="grid c${c}">
      ${list.cols.map((col,ci)=>`<div><label>${col.label}</label><textarea data-s="${sid}" data-list="${list.id}" data-ri="${ri}" data-c="${col.id}" placeholder="${esc(list.ph?list.ph[ci]:'')}">${esc(r[col.id]||'')}</textarea></div>`).join('')}
      </div></div>`).join('')}
    </div>
    <button class="btn sm add" data-add="${list.id}" data-s="${sid}">＋ 行を追加</button>
  </div>`;
}

function stepMain(i){
  const s=STEPS[i]; const sid=s.id;
  let h = `<div class="card main" id="main-${sid}">
    <div class="card-h"><span class="k">${s.k}</span><h2>${s.title}</h2>${s.private?'<span class="private">● 自分だけのメモ</span>':''}</div>
    <p class="lead">${s.lead}</p>`;
  if(i===0){
    h += `<div class="meta">
      <div><label>日付</label><input type="date" data-meta="date" value="${esc(state.meta.date)}"></div>
      <div><label>実施する人（自分）</label><input type="text" data-meta="who" value="${esc(state.meta.who)}" placeholder="例：森山"></div>
      <div><label>相手</label><input type="text" data-meta="partner" value="${esc(state.meta.partner)}" placeholder="例：田中さん"></div>
    </div>`;
  }
  if(s.prompts) h += `<div class="prompts"><b>この段階で確かめること</b><ul>${s.prompts.map(p=>`<li>${p}</li>`).join('')}</ul></div>`;
  (s.fields||[]).forEach(f=> h+=fieldHTML(sid,f));
  if(s.list) h += listHTML(sid, s.list);
  (s.fields2||[]).forEach(f=> h+=fieldHTML(sid,f));

  // nav
  const isLast = i===STEPS.length-1;
  let prevI = i-1; while(prevI>=0 && !visibleIndex(prevI)) prevI--;
  h += `<div class="nav">
    ${prevI>=0?`<button class="btn" data-goto="${prevI}">← ${STEPS[prevI].k} に戻る</button>`:'<span></span>'}
    <span class="spacer"></span>
    <span class="status">入力内容はこの端末のブラウザ内に自動保存されます</span>
    ${isLast
      ? `<button class="btn warm" id="btnPrint2">まとめを印刷 / PDF</button>`
      : (i===state.unlocked
          ? `<button class="btn primary" data-next="${i+1}">${STEPS[i+1].k} へ進む →</button>`
          : `<button class="btn primary" data-goto="${i+1}">${STEPS[i+1].k} へ →</button>`)}
  </div></div>`;
  return h;
}

function valueBlock(sid, f){
  const v = state.data[sid][f.id]||'';
  return `<div class="sitem"><div class="t">${f.label}</div><div class="v ${v?'':'empty'}">${v?esc(v):'（未記入）'}</div></div>`;
}
function listBlock(sid, list){
  const rows=(state.data[sid][list.id]||[]).filter(r=>list.cols.some(c=>(r[c.id]||'').trim()));
  if(!rows.length) return `<div class="sitem"><div class="t">${list.label}</div><div class="v empty">（未記入）</div></div>`;
  return `<div class="sitem"><div class="t">${list.label}</div><div class="v">${rows.map((r,ri)=>`<div class="li">${list.cols.map(c=> (r[c.id]||'').trim()?`<div><span class="lt">${c.label}：</span>${esc(r[c.id])}</div>`:'').join('')}</div>`).join('')}</div></div>`;
}
function stepSide(i, open){
  const s=STEPS[i]; const sid=s.id;
  let body='';
  (s.fields||[]).forEach(f=> body+=valueBlock(sid,f));
  if(s.list) body+=listBlock(sid,s.list);
  (s.fields2||[]).forEach(f=> body+=valueBlock(sid,f));
  return `<div class="card"><details ${open?'open':''}>
    <summary><span class="k">${s.k}</span>${s.title}<span class="arrow">▶</span></summary>
    <div class="sbody">${body}<button class="edit-link" data-goto="${i}">このステップを開いて編集する</button></div>
  </details></div>`;
}

function render(){
  renderStepper();
  const i=state.current;
  const prev = []; for(let j=0;j<i;j++) if(visibleIndex(j)) prev.push(j);
  const app=$('#app');
  if(prev.length){
    app.innerHTML = `<div class="layout with-side">
      <aside class="side"><p class="side-note">これまでのステップ</p>${prev.map(j=>stepSide(j, j===prev[prev.length-1])).join('')}</aside>
      <div>${stepMain(i)}</div></div>`;
  }else{
    app.innerHTML = `<div class="layout">${stepMain(i)}</div>`;
  }
  $('#shareMode').checked = state.share;
  bind();
  window.scrollTo({top:0});
}

function bind(){
  const app=$('#app');
  app.querySelectorAll('textarea[data-f],input[data-f]').forEach(el=>{
    el.addEventListener('input', ()=>{ state.data[el.dataset.s][el.dataset.f]=el.value; persist(); autosize(el); });
    autosize(el);
  });
  app.querySelectorAll('textarea[data-list]').forEach(el=>{
    el.addEventListener('input', ()=>{ state.data[el.dataset.s][el.dataset.list][+el.dataset.ri][el.dataset.c]=el.value; persist(); autosize(el); });
    autosize(el);
  });
  app.querySelectorAll('input[data-meta]').forEach(el=>{
    el.addEventListener('input', ()=>{ state.meta[el.dataset.meta]=el.value; persist(); });
  });
  app.querySelectorAll('[data-add]').forEach(b=> b.onclick=()=>{
    const s=STEPS.find(x=>x.id===b.dataset.s);
    state.data[b.dataset.s][b.dataset.add].push(emptyRow(s.list)); persist(); render();
    const rows=$('#app').querySelectorAll('.row'); const last=rows[rows.length-1]; if(last){ last.querySelector('textarea').focus(); last.scrollIntoView({block:'center'}); }
  });
  app.querySelectorAll('[data-rm]').forEach(b=> b.onclick=()=>{
    const wrap=b.closest('.rows'); state.data[wrap.dataset.s][wrap.dataset.list].splice(+b.dataset.rm,1); persist(); render();
  });
  app.querySelectorAll('[data-goto]').forEach(b=> b.onclick=()=>goto(+b.dataset.goto));
  app.querySelectorAll('[data-next]').forEach(b=> b.onclick=()=>{
    const n=+b.dataset.next; if(n>state.unlocked) state.unlocked=n; goto(n);
  });
  const p2=$('#btnPrint2'); if(p2) p2.onclick=doPrint;
}
function autosize(el){ if(el.tagName!=='TEXTAREA') return; el.style.height='auto'; el.style.height=Math.max(el.scrollHeight+2, el.classList.contains('sm')?60:88)+'px'; }
function goto(i){ if(i<0||i>=STEPS.length) return; if(i>state.unlocked) return; state.current=i; persist(); render(); }

/* =========================================================
   まとめ（印刷）
   ========================================================= */
function renderSummary(){
  const el=$('#summary');
  let h=`<div class="sum-head"><h2>MMOT の4ステップ ─ 実践ワークシート</h2><span class="rfc">ROBERT FRITZ CONSULTING</span></div>
  <div class="sum-meta">日付：${esc(state.meta.date)}　実施する人：${esc(state.meta.who)||'—'}　相手：${esc(state.meta.partner)||'—'}</div>`;
  STEPS.forEach((s,i)=>{
    if(!visibleIndex(i)) return;
    if(i>state.unlocked) return;
    const sid=s.id; let body='';
    (s.fields||[]).forEach(f=> body+=sumBlock(sid,f));
    if(s.list){ const lb=listBlock(sid,s.list); if(!lb.includes('class="v empty"')) body+=lb.replace('sitem','sum-item'); }
    (s.fields2||[]).forEach(f=> body+=sumBlock(sid,f));
    h+=`<div class="sum-step"><h3><span class="k">${s.k}</span>${s.title}${s.private?'（自分用メモ）':''}</h3>${body}</div>`;
  });
  el.innerHTML=h;
}
function sumBlock(sid,f){ const v=state.data[sid][f.id]||''; if(!v) return ''; return `<div class="sum-item"><div class="t">${f.label}</div><div class="v">${esc(v)}</div></div>`; }
function doPrint(){ renderSummary(); setTimeout(()=>window.print(), 50); }

/* =========================================================
   ツールバー
   ========================================================= */
function confirmDlg(title, body, ok){
  $('#mTitle').textContent=title; $('#mBody').textContent=body; $('#modal').classList.add('show');
  $('#mOk').onclick=()=>{ $('#modal').classList.remove('show'); ok(); };
  $('#mCancel').onclick=()=>$('#modal').classList.remove('show');
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

$('#btnSave').onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  const nm=(state.meta.partner||'').replace(/[\\/:*?"<>|]/g,'');
  a.download=`MMOT_${state.meta.date||''}${nm?'_'+nm:''}.json`; a.click(); URL.revokeObjectURL(a.href);
  toast('JSONファイルを保存しました');
};
$('#btnLoad').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{
    try{ state=merge(defaultState(), JSON.parse(r.result)); persist(); render(); toast('読み込みました'); }
    catch(err){ toast('読み込めませんでした（JSON形式を確認してください）'); }
  }; r.readAsText(f); e.target.value='';
};
$('#btnPrint').onclick=doPrint;
$('#btnNew').onclick=()=>confirmDlg('新規セッションを始めますか？','現在の内容はこの端末から消えます。残しておきたい場合は先に「保存（JSON）」してください。',()=>{
  state=defaultState(); persist(); render(); toast('新しいセッションを始めました');
});
$('#shareMode').onchange=e=>{
  state.share=e.target.checked;
  if(state.share && STEPS[state.current].private){ state.current=1; if(state.unlocked<1) state.unlocked=1; }
  persist(); render();
  toast(state.share?'画面共有モード：ステップ0を非表示にしました':'画面共有モードを解除しました');
};
window.addEventListener('beforeprint', renderSummary);

load(); render();
</script>
</body>
</html>
